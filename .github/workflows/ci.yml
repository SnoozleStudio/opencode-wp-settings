name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  json:
    name: Validate JSON
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Well-formedness
        # bun.lock is bun's text format: JSON-with-trailing-commas by design in
        # every bun version - never strict JSON. The lockfile step below is its
        # real validation.
        run: |
          for f in opencode.json tui.json tui.jsonc package.json; do
            jq empty "$f"
          done
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Lockfile integrity
        run: bun install --frozen-lockfile --dry-run

  structure:
    name: Structure & frontmatter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: setup.ps1 -Validate
        shell: pwsh
        run: pwsh -NoProfile -File setup.ps1 -Validate

  docs:
    name: Docs inventory & links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Docs inventory
        shell: pwsh
        run: pwsh -NoProfile -File scripts/docs-inventory.ps1

  chain:
    name: Verification-chain consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Chain consistency
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-chain-consistency.ps1

  smoke:
    name: Scaffold smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Theme template dry run
        shell: pwsh
        run: pwsh -NoProfile -File setup.ps1 -NewTheme "$env:RUNNER_TEMP/theme-tst" -Slug theme-tst -Prefix tst_ -Name "Test Theme" -DryRun
      - name: Plugin template dry run
        shell: pwsh
        run: pwsh -NoProfile -File setup.ps1 -NewPlugin "$env:RUNNER_TEMP/plugin-tst" -Slug plugin-tst -Prefix tst_ -Name "Test Plugin" -DryRun

  workflows:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz
      - name: Run actionlint
        run: ./actionlint
      - name: Install zizmor
        run: python -m pip install --quiet zizmor==1.30.1
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .