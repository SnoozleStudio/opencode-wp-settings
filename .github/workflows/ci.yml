name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Well-formedness
        # bun.lock is bun's text format: JSON-with-trailing-commas by design in
        # every bun version - never strict JSON. The lockfile step below is its
        # real validation.
        run: |
          for f in opencode.json tui.json package.json; do
            jq empty "$f"
          done
      - uses: oven-sh/setup-bun@v2
      - name: Lockfile integrity
        run: bun install --frozen-lockfile --dry-run

  structure:
    name: Structure & frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup.ps1 -Validate
        shell: pwsh
        run: pwsh -NoProfile -File setup.ps1 -Validate

  docs:
    name: Docs inventory & links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs inventory
        shell: pwsh
        run: pwsh -NoProfile -File scripts/docs-inventory.ps1

  chain:
    name: Verification-chain consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chain consistency
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-chain-consistency.ps1

  smoke:
    name: Scaffold smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme template dry run
        shell: pwsh
        run: pwsh -NoProfile -File setup.ps1 -NewTheme "$env:RUNNER_TEMP/theme-tst" -Slug theme-tst -Prefix tst_ -Name "Test Theme" -DryRun
      - name: Plugin template dry run
        shell: pwsh
        run: pwsh -NoProfile -File setup.ps1 -NewPlugin "$env:RUNNER_TEMP/plugin-tst" -Slug plugin-tst -Prefix tst_ -Name "Test Plugin" -DryRun
