name: Verification chain

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  verify:
    name: Build, format, phpcs, phpstan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --prefer-dist --no-progress
      - name: Build
        run: npm run build
      - name: Format check
        run: npm run format:all:check
      - name: PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml -d memory_limit=1024M
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  workflows:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz
      - name: Run actionlint
        run: ./actionlint
      - name: Install zizmor
        run: python -m pip install --quiet zizmor==1.30.1
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .